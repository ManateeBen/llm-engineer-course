<div class="viz" id="viz-memory">
  <div class="viz-title"><span class="viz-badge a">A 类</span>显存瀑布：16Ψ、激活与重计算的三方拉扯</div>
  <svg viewBox="0 0 640 440" role="img" aria-label="调节参数量、并行分片、序列长度与重计算档位，观察每卡显存构成相对卡容量的变化">
    <g id="mm-static"></g>
    <g id="mm-anim"></g>
  </svg>
  <div class="viz-ctrl">
    <label>参数量<span id="mm-n-val">13B</span>
      <input type="range" id="mm-n" min="0" max="3" value="1" step="1">
    </label>
    <label>分片度（TP×PP×DP）<span id="mm-sh-val">8</span>
      <input type="range" id="mm-sh" min="0" max="4" value="2" step="1">
    </label>
    <label>序列长 s<span id="mm-s-val">4096</span>
      <input type="range" id="mm-s" min="0" max="3" value="0" step="1">
    </label>
    <label>重计算<span id="mm-rc-val">选择性</span>
      <input type="range" id="mm-rc" min="0" max="2" value="1" step="1">
    </label>
  </div>
  <div class="viz-cap">堆叠柱：权重/梯度/优化器（静态 16Ψ 按分片度除）、激活（34sbhL 按重计算档位除 17/5/1）、临时 10%。红线 = 80 GB 卡可用线。拖动重计算档位：全量重算激活 /17 但时间 +33%（8-6 §4 的定价）；分片度是静态池唯一的杠杆（ZeRO/TP/PP 都作用在这里）。</div>
</div>
