<div class="viz" id="viz-dropout">
  <div class="viz-title"><span class="viz-badge a">A 类</span>Dropout：把过拟合的缝隙压回训练/验证曲线之间</div>
  <svg viewBox="0 0 640 360" role="img" aria-label="Dropout 前后的训练与验证损失曲线动画">
    <g id="viz-dropout-static"></g>
    <g id="viz-dropout-anim"></g>
  </svg>
  <div class="viz-ctrl">
    <label>Dropout 率 p = <input type="range" id="viz-dropout-p" min="0" max="0.7" step="0.01" value="0.3"> <b id="viz-dropout-pval">0.30</b></label>
    <button type="button" id="viz-dropout-play">▶ 训练</button>
    <button type="button" id="viz-dropout-reset">重置</button>
  </div>
  <div class="viz-cap">实线为训练 loss，虚线为验证 loss，纵轴 loss、横轴 epoch。p=0 时训练 loss 俯冲、验证 loss 翘起——过拟合；p 增大后训练被拖慢（子网络集成要更多 epoch 收敛），验证曲线被压住，两条线的缝隙就是泛化 gap。注意 p 也不是越大越好：0.7 时训练 loss 都降不动了。</div>
</div>
