  <div class="viz-cap">上：三种组装范式——桥接式（LLaVA，视觉 token 直接拼接，中开销）、查询式（BLIP-2，Q-Former 压到固定 32~256 token，算力可预测）、注入式（CogVLM，每层 cross-attention，上限最高开销最大）。下：anyres 切图经济学——n×n 网格 + 1 全局缩略图，token 数 =(n²+1)×576；4×4 时单图 9792 token，7B 模型 KV ≈ 4.6 GB/图，多图会话迅速吃掉显存：先算 8-7 的账再定切分。</div>
