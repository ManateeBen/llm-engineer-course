  <svg viewBox="0 0 640 400" role="img" aria-label="展示消融差异随规模变化的幂律外推曲线与敏感性迁移分级表">

  <div class="viz-cap">幂律外推：L(N,D)=E+A/N^α+B/D^β，在 4~6 个小尺度拟合后外推目标规模——有效条件是拟合区间覆盖目标 1/10~1/3、数据质量不变、架构族不变。右表是敏感性迁移分级：数据配比强（分布效应尺度不变），学习率中（µP 后可到强），架构组件弱~中，正则弱，对齐方法中（基座能力改变交互项）。交互效应是单变量消融的最大陷阱：A、B 各掉 1 点、同时去掉掉 5.5 点 ⇒ 交互 3.5 点，"A 无用"的单变量结论被推翻。</div>
