  <svg viewBox="0 0 640 400" role="img" aria-label="左侧为有用性与无害性的帕累托前沿散点图，右侧为训练层、系统层、运营层的同心圆防御图">
    <g id="sf-static"></g>

  <div class="viz-cap">左：每个训练配置落在 helpfulness–harmlessness 平面上，有效配置连成 Pareto 前沿——更帮忙与更谨慎不可兼得；产品选点是业务/合规决策（国内场景通常偏 harmlessness），技术侧要交付前沿曲线而不是自己拍点。右：深度防御三层——训练层抬高普通攻击成本，系统层挡住穿透者，运营层保证响应周期 < 攻击扩散周期；任何单层都可被穿透是设计前提。</div>
