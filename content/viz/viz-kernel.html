  <div class="viz-ctrl">

  <div class="viz-cap">横轴算术强度 I（FLOPs/Byte，对数），纵轴可达性能（FLOP/s，对数）。斜线是带宽上限 I·B_max，水平线是算力峰值 P_max，交点即临界强度 I*=P_max/B_max≈275。拖动滑杆改变 GEMM 的 batch 维度 M（K=N=4096 固定）：M=1 时 I≈1，深陷带宽受限区；M 增大后沿斜线爬升，越过 I* 后撞上算力平台——再优化算子也无用，只能改形状。对照 8-1 §1 的偏导：∂I/∂M&gt;0 恒成立。</div>
