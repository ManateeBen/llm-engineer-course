<div class="viz" id="viz-gd">
  <div class="viz-title"><span class="viz-badge a">A 类</span>梯度下降：学习率决定"稳稳下山"还是"越弹越高"</div>
  <svg viewBox="0 0 640 340" role="img" aria-label="梯度下降轨迹动画">
    <g id="viz-gd-static"></g>
    <g id="viz-gd-anim"></g>
  </svg>
  <div class="viz-ctrl">
    <label>学习率 η = <input type="range" id="viz-gd-eta" min="0" max="2.5" step="0.05" value="0.3"> <b id="viz-gd-etaval">0.30</b></label>
    <button type="button" id="viz-gd-play">▶ 播放</button>
    <button type="button" id="viz-gd-reset">重置</button>
    <span id="viz-gd-status"></span>
  </div>
  <div class="viz-cap">目标 f(x)=x²，从 x=3 出发。η≤1 时每步到谷底距离缩为原来的 |1−2η|，稳稳收敛；η&gt;1 后每步跨过谷底且越弹越远——"学习率太大直接发散"的数学原型。试试 η=1.2。</div>
</div>
